<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gotcha! Prototype</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
            text-align: center;
        }

        h1 {
            color: #2d6a4f;
        }

        .clue-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,.1);
        }

        button {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        #preview {
            margin-top: 20px;
            max-width: 100%;
            border-radius: 10px;
            display: none;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }

        .camera-input {
            display: none;
        }
    </style>
</head>
<body>

    <h1>🎯 Gotcha!</h1>

    <div class="clue-box">
        <h2>Today's Clue</h2>
        <p>
            America's pastime begins with this piece of leather.
            Find it and take a picture.
        </p>
    </div>

    <button onclick="openCamera()">
        Take Photo
    </button>

    <input
        type="file"
        id="cameraInput"
        class="camera-input"
        accept="image/*"
        capture="environment">

    <div id="status"></div>

    <img id="preview" alt="Captured Image">

    <script>
        const cameraInput = document.getElementById('cameraInput');
        const preview = document.getElementById('preview');
        const status = document.getElementById('status');

        function openCamera() {
            cameraInput.click();
        }

        cameraInput.addEventListener('change', function(event) {

            const file = event.target.files[0];

            if (!file) return;

            const imageURL = URL.createObjectURL(file);

            preview.src = imageURL;
            preview.style.display = 'block';

            status.innerHTML =
                "✅ Photo captured! Recognition coming next...";
        });
    </script>

</body>
</html>
